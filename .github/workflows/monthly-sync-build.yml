name: 'Sync fork and build DLL'

on:
  schedule:
    - cron: '0 3 1 * *'    # 03:00 UTC on the 1st of every month
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

permissions:
  contents: write            # needed so this workflow can push the synced 'main' back to your fork

jobs:
  sync:
    name: 'Sync fork main with libsdl-org/SDL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0     # full history so a fast-forward merge is possible

      - name: 'Fast-forward main to upstream'
        run: |
          git remote add upstream https://github.com/libsdl-org/SDL.git
          git fetch upstream main
          # --ff-only refuses to run if your fork's main has diverged (e.g. you
          # committed directly to main). That's intentional: it fails loudly
          # instead of silently discarding your changes. If you want your fork's
          # main to always mirror upstream no matter what, replace the next two
          # lines with: git reset --hard upstream/main
          git merge --ff-only upstream/main
          git push origin main

  build-dll:
    name: 'Build SDL3.dll (Windows x64)'
    needs: sync
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the commit sync just pushed

      - name: 'Configure (CMake)'
        run: cmake -S . -B build -DSDL_SHARED=ON -DSDL_STATIC=OFF -DCMAKE_BUILD_TYPE=Release

      - name: 'Build'
        run: cmake --build build --config Release --parallel

      - name: 'Upload SDL3.dll'
        uses: actions/upload-artifact@v4
        with:
          name: SDL3-dll-windows-x64
          path: build/Release/SDL3.dll
          if-no-files-found: error
